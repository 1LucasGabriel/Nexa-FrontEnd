<main>
    <app-side-menu></app-side-menu>

    <section>
        <div class="header-section">
            <div class="title-block">
                <h1>Alojamentos</h1>
                <p>Gestão de unidades de alojamentos</p>
            </div>

            <div class="button-search">
                <app-dynamic-button text="Gerenciar Endereços" [isRounded]="true"
                    (buttonClick)="openAddressModal()"></app-dynamic-button>
                <app-dynamic-button text="Gerenciar Quartos" [isRounded]="true"
                    (buttonClick)="openRoomModal()"></app-dynamic-button>
                <app-dynamic-button [text]="buttonText" [isRounded]="true"
                    (buttonClick)="openAddModal()"></app-dynamic-button>
                <app-dynamic-search-bar (onSearch)="onSearch($event)"></app-dynamic-search-bar>
            </div>
        </div>

        <app-dynamic-table [columns]="columns" [data]="filteredData" [rows]="rows" [totalRecords]="filteredData.length"
            [actions]="actions" (onAction)="handleAction($event)" [statusColorMap]="statusColorMap"></app-dynamic-table>
    </section>

    <p-confirmdialog />
    <app-dynamic-modal [title]="modalTitle" [initialData]="selectedAlojamento" [config]="config" [visible]="isModalOpen"
        (visibleChange)="onModalVisibilityChange($event)" (confirm)="onConfirm($event)"></app-dynamic-modal>

    <p-toast />

    <!-- Modal de Gerenciamento de Endereços -->
    <p-dialog header="Gerenciar Endereços" [(visible)]="isAddressModalOpen" [modal]="true" [draggable]="false"
        [resizable]="false" [style]="{ width: '1200px' }" styleClass="dark-modal" appendTo="body">
        <div class="dialog-layout" style="display: flex; gap: 20px; padding: 10px; color: #fff;">
            <!-- Formulário para Criar Endereço -->
            <div class="address-form"
                style="flex: 1; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <h3 style="margin-top: 0; margin-bottom: 5px; font-weight: 600;">Novo Endereço</h3>
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Nome de Identificação
                        *</label>
                    <input pInputText [(ngModel)]="newAddress.name" placeholder="Ex: Sede, Alojamento A"
                        style="width: 100%;" class="w-full" />
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 2;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Rua *</label>
                        <input pInputText [(ngModel)]="newAddress.street" placeholder="Rua..." style="width: 100%;"
                            class="w-full" />
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Número *</label>
                        <input pInputText [(ngModel)]="newAddress.number" placeholder="123" style="width: 100%;"
                            class="w-full" />
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Bairro</label>
                        <input pInputText [(ngModel)]="newAddress.neighborhood" placeholder="Bairro"
                            style="width: 100%;" class="w-full" />
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Complemento</label>
                        <input pInputText [(ngModel)]="newAddress.complement" placeholder="Apto, Bloco..."
                            style="width: 100%;" class="w-full" />
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 2;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Cidade *</label>
                        <input pInputText [(ngModel)]="newAddress.city" placeholder="Cidade" style="width: 100%;"
                            class="w-full" />
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Estado *</label>
                        <input pInputText [(ngModel)]="newAddress.state" placeholder="UF" style="width: 100%;"
                            class="w-full" />
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">CEP</label>
                        <input pInputText [(ngModel)]="newAddress.zipCode" placeholder="00000-000" style="width: 100%;"
                            class="w-full" />
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">País</label>
                        <input pInputText [(ngModel)]="newAddress.country" placeholder="Brasil" style="width: 100%;"
                            class="w-full" />
                    </div>
                </div>
                <button pButton label="Salvar Endereço" class="p-button-primary" style="margin-top: 10px; width: 100%;"
                    (click)="createAddress()"></button>
            </div>

            <!-- Tabela de Endereços -->
            <div class="address-table-container"
                style="flex: 1.5; max-height: 480px; overflow-y: auto; background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-weight: 600;">Endereços Disponíveis</h3>
                <app-dynamic-table [columns]="addressColumns" [data]="addresses" [rows]="10"
                    [totalRecords]="addresses.length" [actions]="addressActions"
                    (onAction)="handleAddressAction($event)" [loading]="loadingAddresses"
                    [tableStyle]="{ 'min-width': '100%' }">
                </app-dynamic-table>
            </div>
        </div>
    </p-dialog>

    <!-- Modal de Gerenciamento de Quartos -->
    <p-dialog header="Gerenciar Quartos" [(visible)]="isRoomModalOpen" [modal]="true" [draggable]="false"
        [resizable]="false" [style]="{ width: '1200px' }" styleClass="dark-modal" appendTo="body">
        <div class="dialog-layout" style="display: flex; gap: 20px; padding: 10px; color: #fff;">
            <!-- Formulário para Criar Quarto -->
            <div class="address-form"
                style="flex: 1; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <h3 style="margin-top: 0; margin-bottom: 5px; font-weight: 600;">Novo Quarto</h3>
                
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Alojamento *</label>
                    <p-select [(ngModel)]="newRoom.housingId" [options]="housingOptions" 
                        optionLabel="label" optionValue="value" placeholder="Selecione um alojamento"
                        [style]="{ width: '100%' }">
                    </p-select>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Tipo do Quarto *</label>
                    <p-select [(ngModel)]="newRoom.housingRoomType" [options]="roomTypeOptions" 
                        optionLabel="label" optionValue="value" placeholder="Selecione o tipo"
                        [style]="{ width: '100%' }">
                    </p-select>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Número do Quarto *</label>
                    <input pInputText [(ngModel)]="newRoom.number" placeholder="Ex: 101, A" style="width: 100%;" class="w-full" />
                </div>

                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">Capacidade Máxima *</label>
                    <input pInputText type="number" [(ngModel)]="newRoom.maxCapacity" placeholder="Ex: 4" style="width: 100%;" class="w-full" />
                </div>

                <button pButton label="Salvar Quarto" class="p-button-primary" style="margin-top: 10px; width: 100%;"
                    (click)="createRoom()"></button>
            </div>

            <!-- Tabela de Quartos -->
            <div class="address-table-container"
                style="flex: 1.5; max-height: 480px; overflow-y: auto; background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);">
                <h3 style="margin-top: 0; margin-bottom: 15px; font-weight: 600;">Quartos Cadastrados</h3>
                <app-dynamic-table [columns]="roomColumns" [data]="roomsList" [rows]="10"
                    [totalRecords]="roomsList.length" [actions]="roomActions"
                    (onAction)="handleRoomAction($event)" [loading]="loadingRooms"
                    [tableStyle]="{ 'min-width': '100%' }">
                </app-dynamic-table>
            </div>
        </div>
    </p-dialog>
</main>
