<main>
    <app-side-menu></app-side-menu>

    <section>
        <div class="header-section">
            <h1>Cadastrar Alojamentos</h1>

            <div class="button-search">
                <app-dynamic-button [isRounded]="true"></app-dynamic-button>
                <app-dynamic-search-bar></app-dynamic-search-bar>
            </div>
        </div>

        <app-dynamic-table [columns]="columns" [data]="originalData" [totalRecords]="originalData.length" [actions]="actions" (onAction)="handleAction($event)" [statusColorMap]="statusColorMap"></app-dynamic-table>
    </section>

    <p-confirmdialog />
    <app-dynamic-modal [title]="modalConfig.title" [initialData]="selectedAlojamento" [config]="modalConfig" [visible]="isModalOpen" (visibleChange)="onModalVisibilityChange($event)" (confirm)="onConfirm($event)"></app-dynamic-modal>
</main>
